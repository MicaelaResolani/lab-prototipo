<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Lab | Sistema de Laboratorio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <header class="top-bar">
            <h1>🧪 Terminal Lab</h1>
        </header>
        <main class="content">
            <section class="card form-card">
                <h3>Registro de Nueva Muestra</h3>
                <form id="form-muestra">
                    <input type="text" id="paciente" placeholder="Nombre del paciente" required>
                    <select id="tipo-analisis" required>
                        <option value="">Seleccionar estudio...</option>
                        <option value="Hemograma">Hemograma</option>
                        <option value="Urocultivo">Urocultivo</option>
                        <option value="Glucemia">Glucemia</option>
                        <option value="Hepatograma">Hepatograma</option>
                    </select>
                    <button type="submit" class="btn-primary">Registrar Muestra</button>
                </form>
            </section>
            <section class="card list-card">
                <h3>Muestras en Laboratorio</h3>
                <table>
                    <thead>
                        <tr><th>ID</th><th>Paciente</th><th>Estudio</th><th>Estado</th></tr>
                    </thead>
                    <tbody id="lista-muestras"></tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
