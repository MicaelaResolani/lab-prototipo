<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Terminal Lab_03</title>
    <style>
        body { font-family: sans-serif; background: #f3f4f6; padding: 20px; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-card { background: white; padding: 40px; border-radius: 10px; width: 300px; text-align: center; }
        .btn-login { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div id="pantallaLogin" class="login-overlay">
        <div class="login-card">
            <h2>Inicio de Sesión</h2>
            <input type="text" id="email" value="medico@hospital.com" style="width: 100%; margin-bottom: 10px;">
            <button class="btn-login" onclick="iniciar()">Entrar</button>
        </div>
    </div>

    <div id="app" style="display:none;">
        <h1>Terminal Lab</h1>
        <textarea id="texto" style="width: 100%; height: 100px;"></textarea>
        <button onclick="guardar()">Guardar</button>
    </div>

    <script>
        function iniciar() {
            document.getElementById('pantallaLogin').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            console.log("Sesión iniciada");
        }
        function guardar() {
            alert("Guardado: " + document.getElementById('texto').value);
        }
    </script>
</body>
</html>
