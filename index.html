<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Lab_03 - Hospital Provincial de Rosario</title>
    <style>
        /* ==========================================================================
           ESTILOS GLOBALES Y VARIABLES (UI Modernización)
           ========================================================================== */
        :root {
            --bg-principal: #f3f4f6;
            --bg-tarjeta: #ffffff;
            --texto-principal: #1f2937;
            --texto-secundario: #4b5563;
            --borde-suave: #e5e7eb;
            
            /* Colores de Identidad Clínica */
            --color-primario: #2563eb;     /* Azul Institucional */
            --color-primario-hover: #1d4ed8;
            --color-exito: #16a34a;        /* Verde Validation */
            --color-alerta: #dc2626;       /* Rojo Alerta Técnica / Crítico */
            --color-alerta-bg: #fef2f2;    /* Fondo Alerta Soft */
            --color-alerta-borde: #fca5a5;
            --color-medico-bg: #f0fdf4;    /* Fondo Soft para notas médicas */
            --color-medico-borde: #bbf7d0;
            
            /* Tipografía y Espaciados */
            --fuente: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            --radio-borde: 10px;           /* Bordes más redondeados y modernos */
            --sombra-suave: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --sombra-tarjeta: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--fuente);
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            line-height: 1.5;
            padding-bottom: 40px;
        }

        /* ==========================================================================
           BARRA DE NAVEGACIÓN (Navbar)
           ========================================================================== */
        .navbar {
            background-color: #1e3a8a; /* Azul Marino Hospitalario */
            color: #ffffff;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--sombra-suave);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-titulo {
            font-weight: 600;
            font-size: 15pt;
            letter-spacing: 0.5px;
        }

        .navbar-derecha {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-badge {
            background-color: rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 10.5pt;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.2s;
        }

        .btn-logout {
            background-color: transparent;
            color: #fca5a5;
            border: 1px solid rgba(252, 165, 165, 0.4);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 10pt;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background-color: rgba(252, 165, 165, 0.1);
            color: #fca5a5;
            border-color: #fca5a5;
        }

        /* ==========================================================================
           CONTENEDOR PRINCIPAL (Layout de Dos Columnas)
           ========================================================================== */
        .app-container {
            max-width: 1300px;
            margin: 24px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 24px;
        }

        /* ==========================================================================
           PANEL IZQUIERDO: ÓRDENES PENDIENTES (HIS)
           ========================================================================== */
        .panel-izquierdo {
            background-color: var(--bg-tarjeta);
            border-radius: var(--radio-borde);
            border: 1px solid var(--borde-suave);
            box-shadow: var(--sombra-tarjeta);
            padding: 20px;
            height: fit-content;
        }

        .seccion-titulo {
            font-size: 13pt;
            color: #1e3a8a;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #eff6ff;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .lista-ordenes {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tarjeta-orden {
            border: 1px solid var(--borde-suave);
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #f9fafb;
        }

        .tarjeta-orden:hover {
            border-color: #93c5fd;
            background-color: #f0f7ff;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .tarjeta-orden.activa {
            border-color: var(--color-primario);
            background-color: #eff6ff;
            border-left: 4px solid var(--color-primario);
        }

        .orden-header {
            display: flex;
            justify-content: space-between;
            font-size: 9.5pt;
            color: var(--texto-secundario);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .orden-paciente {
            font-weight: 600;
            color: var(--texto-principal);
            font-size: 11pt;
            margin-bottom: 4px;
        }

        .orden-meta {
            font-size: 9pt;
            color: var(--texto-secundario);
        }

        /* ==========================================================================
           PANEL DERECHO: ÁREA DE TRABAJO (Protocolo Clínico)
           ========================================================================== */
        .panel-derecho {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .bloque-blanco {
            background-color: var(--bg-tarjeta);
            border-radius: var(--radio-borde);
            border: 1px solid var(--borde-suave);
            box-shadow: var(--sombra-tarjeta);
            padding: 24px;
        }

        /* Datos del Paciente Seleccionado */
        .paciente-header-block {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            background-color: #f8fafc;
            border: 1px solid var(--borde-suave);
            border-radius: 8px;
            padding: 16px;
        }

        .dato-clinico label {
            display: block;
            font-size: 9pt;
            text-transform: uppercase;
            color: var(--texto-secundario);
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .dato-clinico span {
            font-size: 11.5pt;
            font-weight: 600;
            color: var(--texto-principal);
        }

        /* Formulario de Carga de Resultados */
        .tabla-resultados {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin-top: 10px;
        }

        .tabla-resultados th {
            text-align: left;
            color: var(--texto-secundario);
            font-size: 9.5pt;
            font-weight: 600;
            padding: 0 12px 6px 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tabla-resultados td {
            background-color: #f9fafb;
            padding: 12px;
            border-top: 1px solid var(--borde-suave);
            border-bottom: 1px solid var(--borde-suave);
        }

        .tabla-resultados tr td:first-child {
            border-left: 1px solid var(--borde-suave);
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
            font-weight: 600;
            color: #1e3a8a;
        }

        .tabla-resultados tr td:last-child {
            border-right: 1px solid var(--borde-suave);
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .input-resultado {
            width: 100%;
            max-width: 140px;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 11pt;
            font-weight: 600;
            text-align: right;
            transition: all 0.2s;
        }

        .input-resultado:focus {
            outline: none;
            border-color: var(--color-primario);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background-color: #ffffff;
        }

        .unidad-medida {
            font-size: 10pt;
            color: var(--texto-secundario);
            font-weight: 500;
            margin-left: 8px;
        }

        .rango-referencia {
            font-size: 9.5pt;
            color: #64748b;
            font-style: italic;
        }

        /* ==========================================================================
           CANAL INTEROPERABLE (Doble Vía Médico <-> Bioquímico)
           ========================================================================== */
        .bloque-comunicacion {
            border-radius: var(--radio-borde);
            padding: 20px;
            box-shadow: var(--sombra-suave);
            border: 1px solid var(--borde-suave);
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sub-bloque-nota {
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--borde-suave);
        }
